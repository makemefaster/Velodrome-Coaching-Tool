<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Velodrome Coaching Board</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="badge">250M</span>
      <h1>Velodrome Coaching Board</h1>
    </div>

    <div class="header-actions">
      <select id="preset-select" title="Load Formation Preset"></select>
      <button id="btn-add-rider" class="btn secondary">+ Cyclist</button>
      <button id="btn-add-derny" class="btn secondary">+ Derny</button>
      <button id="btn-reset" class="btn ghost">Reset</button>
    </div>
  </header>

  <main class="board-layout">
    <!-- Main Track Canvas -->
    <div class="canvas-stage">
      <canvas id="track-canvas"></canvas>

      <!-- Selected Rider Quick Inspector (appears when you click a cyclist) -->
      <div class="rider-inspector hidden" id="rider-inspector">
        <span class="inspector-title" id="insp-title">Cyclist #1</span>
        <label>Jersey <input type="color" id="insp-jersey" value="#0284c7" /></label>
        <label>Helmet <input type="color" id="insp-helmet" value="#ef4444" /></label>
        <label>Speed: <strong id="insp-speed-val">42</strong> km/h
          <input type="range" id="insp-speed" min="15" max="65" value="42" />
        </label>
        <button id="insp-lock-zone" class="btn mini" title="Use track height speed vs custom speed">Zone Speed: ON</button>
        <button id="insp-delete" class="btn mini danger" title="Remove rider">✕</button>
      </div>
    </div>

    <!-- Bottom Control Bar -->
    <div class="control-dock">
      <!-- Playback & Zone Speeds -->
      <div class="dock-group">
        <button id="btn-play" class="btn primary">▶ Play</button>
        <div class="speed-pills" title="Set speed by track height">
          <label>Low (Black/Red): <input type="number" id="speed-low" min="15" max="65" value="45" /> km/h</label>
          <label>Mid (Blue): <input type="number" id="speed-mid" min="15" max="65" value="35" /> km/h</label>
          <label>High (Banking): <input type="number" id="speed-high" min="10" max="60" value="25" /> km/h</label>
        </div>
      </div>

      <!-- Drawing Tools -->
      <div class="dock-group">
        <button class="tool-btn active" data-tool="move">✋ Drag</button>
        <button class="tool-btn" data-tool="swing-up">⤴ Swing ▲</button>
        <button class="tool-btn" data-tool="swing-down">⤵ Swing ▼</button>
        <button class="tool-btn" data-tool="arrow">↗ Arrow</button>
        <button id="btn-clear-drawings" class="btn ghost">Clear Lines</button>
      </div>

      <!-- View & Image / GIF Export -->
      <div class="dock-group">
        <button id="btn-view-mode" class="btn secondary">View: Full Oval</button>
        <button id="btn-snapshot-png" class="btn secondary" title="Download current frame as PNG">📸 PNG</button>
        <button id="btn-capture-frame" class="btn accent" title="Add current view to GIF storyboard">+ Frame (<span id="frame-count">0</span>)</button>
        <button id="btn-export-gif" class="btn success" title="Export captured frames (or 4s live motion) as GIF">🎬 Export GIF</button>
        <button id="btn-clear-frames" class="btn ghost" title="Clear captured GIF frames">✕</button>
      </div>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
